name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up uv
        uses: astral-sh/setup-uv@v10

      - name: Lock matches pyproject
        run: uv lock --check

      - name: Install ruff
        run: pip install "ruff>=0.15.8"

      - name: ruff check
        run: ruff check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv sync --locked --extra dev --extra acp

      - name: Resolved versions
        run: |
          uv run --no-sync python - <<'PY'
          import platform
          from importlib.metadata import version

          print(f"Python {platform.python_version()}")
          for package in ("pytest", "pytest-asyncio", "anyio", "starlette"):
              print(f"{package} {version(package)}")
          PY

      - name: Run tests
        run: |
          install -d -m 700 "$RUNNER_TEMP/pinky-pytest"
          TMPDIR="$RUNNER_TEMP/pinky-pytest" uv run --no-sync pytest

  frontend:
    name: Frontend (build + i18n)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-svelte
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend-svelte/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Check i18n keys are extracted
        run: |
          npm run i18n:extract || true
          git diff --exit-code src/locales/en.json || (echo "::error::New i18n keys found — run 'npm run i18n:sync' and commit the result" && exit 1)

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build
